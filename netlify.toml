[build]
  command = "bash .scripts/fingerprint.sh"
  publish = "public"

# The build adds ?v=<checksum> to these URLs, so a changed file always gets a new URL.
[[headers]]
  for = "/style.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/icons.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[plugins]]
  package = "@netlify/plugin-lighthouse"

### Alternative URLs for the CV ###

[[redirects]]
  from = "/joaoportela.pdf"
  to = "/cv_joao_portela.pdf"
  status = 302

[[redirects]]
  from = "cv.pdf"
  to = "/cv_joao_portela.pdf"
  status = 302

[[redirects]]
  from = "cv_joaoportela.pdf"
  to = "/cv_joao_portela.pdf"
  # I actually like cv_joaoportela.pdf so, we'll render it directly.
  status = 200

## Access CV without .pdf file extension (has to be the same number as above +1 for the original file name) ##

[[redirects]]
  from = "cv_joao_portela"
  to = "/cv_joao_portela.pdf"
  status = 302

[[redirects]]
  from = "joaoportela"
  to = "/cv_joao_portela.pdf"
  status = 302

[[redirects]]
  from = "cv"
  to = "/cv_joao_portela.pdf"
  status = 302

[[redirects]]
  from = "cv_joaoportela"
  to = "/cv_joao_portela.pdf"
  status = 302
